name: experiment-validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/engine/**"
      - "packages/configs/**"

jobs:
  validate:
    if: startsWith(github.head_ref, 'experiment/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: reject protected paths
        run: python -m app.evolution.paths origin/main
