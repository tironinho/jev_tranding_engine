# Pesos e limiares de promoção NÃO foram otimizados.
# Servem para bloquear promoção fraca. Calibrar com amostra real antes de confiar no score.

windows:
  calendar: [24h, 7d, 30d, 90d]
  trades: [50, 100, 500]

promotion:
  min_trades: 100
  min_expectancy_improvement: 0.05
  max_drawdown_increase: 0.0
  min_profit_factor: 1.2
  min_oos_score: 0.0
  require_walk_forward: true
  require_monte_carlo: true
  min_paper_trades: 100
  min_paper_days: 14

walk_forward:
  train_days: 90
  validate_days: 30

strategy_score:
  expectancy: 1.0
  profit_factor: 0.5
  sharpe: 0.25
  drawdown_penalty: 1.0
  execution_cost_penalty: 0.5
  ai_cost_penalty: 0.5

bootstrap_versions:
  baseline: B-001
  baseline_jev: J-001
  baseline_openai_jev: OJ-001
