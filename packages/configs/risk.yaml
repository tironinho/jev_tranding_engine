# Limites iniciais conservadores. Não foram otimizados.
# Alavancagem não aparece no dashboard de propósito.

target_mode: structure
# Se o nível de 15 minutos paga menos que o múltiplo do stop, o alvo é o múltiplo.
target_fallback: rr
fixed_target_pct: 0.01
rr_target_multiple: 2.5
atr_buffer_mult: 0.10
# 2x o ATR de 1 minuto. O piso de 0,25% sozinho cabia dentro do pavio.
atr_stop_mult: 2.0
max_stop_pct: 0.03
# Piso de taxa. Se o ATR for maior, o stop usa o ATR.
min_stop_pct: 0.0025
min_entry_interval_seconds: 60
# Depois de um stop, o mesmo símbolo espera 15 candles de 1 minuto.
stop_cooldown_minutes: 15
# Abaixo disto a ordem é resto de banca, não um sinal.
min_order_notional: 50
# No prazo, só fecha quem está no prejuízo. Quem está no lucro segue até o alvo ou o stop.
max_hold_minutes: 60
# Outro ativo pode abrir. O mesmo ativo não ganha uma segunda posição.
allow_pyramiding: false
max_leverage: 1
apply_funding: true
expected_hold_minutes: 15
funding_interval_minutes: 480
order_style: market
allow_partial_entry: false
limit_ttl_ms: 60000
