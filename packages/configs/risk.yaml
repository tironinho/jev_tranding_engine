# Limites iniciais conservadores. Não foram otimizados.
# A alavancagem só vale no livro simulado.

target_mode: structure
# O alvo cabe na faixa de 60 minutos e é limitado a 2,0R. Atingido +1R, o stop move para breakeven.
# Se depois da taxa o trade não pagar pelo menos 1,5R líquido, a entrada é recusada.
target_fallback: rr
fixed_target_pct: 0.01
rr_target_multiple: 2.0
cap_target_by_rr: true
step_stop_to_breakeven: true
atr_buffer_mult: 0.10
# 2x o ATR de 1 minuto, o piso de 0,25% e a maior amplitude das últimas cinco velas de 1 minuto.
atr_stop_mult: 2.0
max_stop_pct: 0.03
# Piso de taxa. Se o candle recente for maior, o stop usa essa amplitude.
min_stop_pct: 0.0025
min_entry_interval_seconds: 60
# Depois de um stop, o mesmo símbolo espera 15 candles de 1 minuto.
stop_cooldown_minutes: 15
# Mínimo da Binance no spot/margem. 50 bloqueava a conta de ~20 USDT: 0,5% de risco não chega lá.
min_order_notional: 5
# A Binance liquida a margem cruzada perto de 1,1. Abaixo de 2 não abre entrada nova. A saída segue.
min_margin_level: 2
# No prazo, só fecha quem está no prejuízo. Quem está no lucro segue até o alvo ou o stop.
max_hold_minutes: 60
# Outro ativo pode abrir. O mesmo ativo não ganha uma segunda posição.
allow_pyramiding: false
# Cross margin de papel até 5x. A margem travada é o nocional dividido por 5. Ordem real continua bloqueada.
max_leverage: 5
apply_funding: true
expected_hold_minutes: 15
funding_interval_minutes: 480
order_style: market
allow_partial_entry: false
limit_ttl_ms: 60000
