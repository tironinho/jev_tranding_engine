# Limites iniciais conservadores. Não foram otimizados.
# Limites aplicados pelo motor antes da execução; armar produção é uma configuração separada.

target_mode: structure
# Baseline e Jev: o alvo aceito precisa estar a pelo menos 3R bruto.
# O piso líquido de 1,5R continua cobrindo taxas, slippage e juros.
target_fallback: rr
fixed_target_pct: 0.01
rr_target_multiple: 3.0
cap_target_by_rr: true
step_stop_to_breakeven: true
dynamic_rr_enabled: true
plan_stress_bps: 2.0
probability_haircut: 0.05
# Não aceita um plano apenas por EV ligeiramente acima de zero. Exige folga
# contra erro de calibração da probabilidade e variação de taxa/slippage.
min_expected_net_r: 0.15
min_gross_rr: 3.0
# Cenário de estresse (1 bp/h), não taxa efetiva da conta. Usa a maior entre esta e a observada.
borrow_hourly_stress_rate: 0.0001
# Orçamento agregado de perda planejada; não pressupõe independência entre moedas.
max_portfolio_stop_risk: 0.02
atr_buffer_mult: 0.10
# 2x o ATR de 1 minuto, o piso de 0,25% e a maior amplitude das últimas cinco velas de 1 minuto.
atr_stop_mult: 2.0
max_stop_pct: 0.03
# Piso de taxa. Se o candle recente for maior, o stop usa essa amplitude.
min_stop_pct: 0.0025
min_entry_interval_seconds: 60
# Depois de um stop, o mesmo símbolo espera 15 candles de 1 minuto.
stop_cooldown_minutes: 15
# Mínimo da Binance no spot/margem. 50 bloqueava a conta de ~20 USDT: 0,5% de risco não chega lá.
min_order_notional: 5
# A Binance liquida a margem cruzada perto de 1,1. Abaixo de 2 não abre entrada nova. A saída segue.
min_margin_level: 2
# O horizonte continua sendo enviado ao JEV para avaliar a continuação. A posição
# não fecha pelo relógio: sai no alvo de 3R ou no stop, que sobe em 1R e 2R.
max_hold_minutes: 60
time_exit_enabled: false
# Outro ativo pode abrir. O mesmo ativo não ganha uma segunda posição.
allow_pyramiding: false
# Teto de alavancagem para dimensionamento; não altera a autorização de ordens reais.
max_leverage: 5
apply_funding: true
expected_hold_minutes: 15
funding_interval_minutes: 480
order_style: market
allow_partial_entry: false
limit_ttl_ms: 60000
