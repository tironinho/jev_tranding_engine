# Defaults de boot. O dashboard persiste override no banco.
# Pesos e limiares NÃO foram otimizados. Calibrar com backtest antes de live.
# As três contas são paper: fill simulado, nunca ordem na Binance.
# call_model=true gasta OpenAI só quando OPENAI_API_KEY existe.
# Sem chave a estratégia fica em standby e não inventa decisão.

strategies:
  baseline:
    enabled: true
    mode: paper
    max_signal_age_ms: 2000
    call_model: false

  baseline_jev:
    enabled: true
    mode: paper
    max_signal_age_ms: 4000
    call_model: true

  baseline_openai_jev:
    enabled: true
    mode: paper
    max_signal_age_ms: 20000
    call_model: true

combination:
  baseline_version: baseline_score_v1
  jev_rule_version: jev_veto_only_v1
  openai_rule_version: openai_jev_veto_only_v1
  # Jev não cria trade que a baseline recusou e não inverte direção.
  failure_policy: NO_TRADE
  min_trend_continuation: 0.55
  max_reversal: 0.50
  # Noul near 0.5 is uncertainty. A false-breakout veto needs a clear yes, and only when a breakout exists.
  max_false_breakout: 0.80
  min_pressure_edge: 0.05
  max_liquidity_sweep: 0.75
  baseline_weight: 0.65
  jev_weight: 0.35
  max_reversal_risk: 0.65
  max_anomaly: 0.80
  min_openai_confidence: 0.45
  block_long_regimes:
    - bearish_expansion
    - bearish_exhaustion
    - breakdown
  block_short_regimes:
    - bullish_expansion
    - breakout
