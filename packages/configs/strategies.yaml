
strategies:
  baseline:
    enabled: true
    mode: paper
    max_signal_age_ms: 2000
    call_model: false

  baseline_jev:
    enabled: true
    mode: paper
    max_signal_age_ms: 12000
    call_model: true

combination:
  baseline_version: baseline_classified_v1
  jev_rule_version: jev_economic_gate_v2
  openai_rule_version: openai_jev_economic_gate_v2
  failure_policy: NO_TRADE
  min_trend_continuation: 0.55
  min_short_continuation: 0.40
  extra_entry_min_continuation: 0.80
  max_reversal: 0.65
  max_false_breakout: 0.80
  min_pressure_edge: 0.05
  max_liquidity_sweep: 0.75
  baseline_weight: 0.65
  jev_weight: 0.35
  max_reversal_risk: 0.65
  max_anomaly: 0.80
  min_openai_confidence: 0.45
  block_long_regimes:
    - bearish_expansion
    - bearish_exhaustion
    - breakdown
  block_short_regimes:
    - bullish_expansion
    - breakout
