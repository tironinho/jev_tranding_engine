
strategies:
  baseline:
    enabled: true
    mode: paper
    max_signal_age_ms: 2000
    call_model: false

  baseline_jev:
    enabled: true
    mode: paper
    # A Binance 1m close can arrive around 10s after its exchange timestamp;
    # account reconciliation and durable risk records also share this budget.
    # Execution still requires a fresh order book and <=0.1% price drift.
    max_signal_age_ms: 30000
    call_model: true

combination:
  baseline_version: baseline_classified_v1
  jev_rule_version: jev_context_candidate_v3
  openai_rule_version: openai_jev_economic_gate_v2
  failure_policy: NO_TRADE
  # Direction-neutral quality floor. The per-plan break-even probability plus
  # haircut remains the stricter gate whenever costs/R:R require it.
  min_trend_continuation: 0.40
  min_short_continuation: 0.40
  # Coherent sub-threshold signals may use the richer context and JEV. This is
  # only a candidate gate; the JEV probability and positive-EV plan still gate execution.
  candidate_min_abs_score: 0.15
  # Moderate disagreement may be reviewed by JEV; strong disagreement and
  # flow against the candidate remain blocked before the provider call.
  candidate_min_agreement: 0.60
  extra_entry_min_continuation: 0.80
  max_reversal: 0.65
  max_false_breakout: 0.80
  min_pressure_edge: 0.05
  max_liquidity_sweep: 0.75
  baseline_weight: 0.65
  jev_weight: 0.35
  max_reversal_risk: 0.65
  max_anomaly: 0.80
  min_openai_confidence: 0.45
  block_long_regimes:
    - bearish_expansion
    - bearish_exhaustion
    - breakdown
  block_short_regimes:
    - bullish_expansion
    - breakout
