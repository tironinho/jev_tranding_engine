# Defaults de boot. O dashboard persiste override no banco.
# Pesos e limiares NÃO foram otimizados. Calibrar com backtest antes de live.
# A baseline fica em shadow. O Jev abre na Binance quando os dois flags de live estão ligados.
# O tamanho usa o USDT real da margem, e a ordem sai por Singapura.

strategies:
  baseline:
    enabled: true
    mode: shadow
    max_signal_age_ms: 2000
    call_model: false

  baseline_jev:
    enabled: true
    mode: paper
    max_signal_age_ms: 12000
    call_model: true

combination:
  baseline_version: baseline_classified_v1
  jev_rule_version: jev_classified_v1
  openai_rule_version: openai_jev_classified_v1
  # Peso e classe ficam na baseline. O Jev lê o candidato e não cria outro lado.
  failure_policy: NO_TRADE
  # Long confirma em 0,55. Short confirma em 0,40, acima do zero a zero deste payoff.
  # Os dois pisos ainda sobem quando o stop apertado pede mais acerto para pagar o custo.
  min_trend_continuation: 0.55
  min_short_continuation: 0.40
  extra_entry_min_continuation: 0.80
  max_reversal: 0.65
  # Noul near 0.5 is uncertainty. A false-breakout veto needs a clear yes, and only when a breakout exists.
  max_false_breakout: 0.80
  min_pressure_edge: 0.05
  max_liquidity_sweep: 0.75
  baseline_weight: 0.65
  jev_weight: 0.35
  max_reversal_risk: 0.65
  max_anomaly: 0.80
  min_openai_confidence: 0.45
  block_long_regimes:
    - bearish_expansion
    - bearish_exhaustion
    - breakdown
  block_short_regimes:
    - bullish_expansion
    - breakout
