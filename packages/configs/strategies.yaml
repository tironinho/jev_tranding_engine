
strategies:
  baseline:
    enabled: true
    mode: shadow
    max_signal_age_ms: 2000
    call_model: false

  baseline_jev:
    enabled: true
    mode: paper
    # A Binance 1m close can arrive around 10s after its exchange timestamp;
    # account reconciliation and durable risk records also share this budget.
    # Execution still requires a fresh order book and <=0.1% price drift.
    max_signal_age_ms: 30000
    call_model: true

combination:
  baseline_version: baseline_score_v1
  jev_rule_version: jev_initial_live_2026_10_08
  jev_request_profile: initial_live_2026_10_08
  openai_rule_version: openai_jev_economic_gate_v2
  failure_policy: NO_TRADE
  # Política da primeira entrada live (d5b2f6d): baseline >=0,45 e Jev >=0,55.
  # O piso também considera taxa/stop; candidatos recusados não chamam o modelo.
  min_trend_continuation: 0.55
  min_short_continuation: 0.55
  # Estes dois parâmetros só são usados pelo perfil de planos/classificação.
  # O perfil inicial encerra NO_TRADE antes de chamar Jev abaixo de 0,45.
  candidate_min_abs_score: 0.15
  # Moderate disagreement may be reviewed by JEV; strong disagreement and
  # flow against the candidate remain blocked before the provider call.
  candidate_min_agreement: 0.60
  extra_entry_min_continuation: 0.80
  max_reversal: 0.65
  max_false_breakout: 0.80
  min_pressure_edge: 0.05
  max_liquidity_sweep: 0.75
  baseline_weight: 0.65
  jev_weight: 0.35
  max_reversal_risk: 0.65
  max_anomaly: 0.80
  min_openai_confidence: 0.45
  block_long_regimes:
    - bearish_expansion
    - bearish_exhaustion
    - breakdown
  block_short_regimes:
    - bullish_expansion
    - breakout
