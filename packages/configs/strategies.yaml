# Defaults de boot. O dashboard persiste override no banco.
# Pesos e limiares NÃO foram otimizados. Calibrar com backtest antes de live.
# As duas contas são paper: fill simulado, nunca ordem na Binance.
# A decisão que abre é a do Jev. A baseline continua calculando o lado, em shadow, sem ordem.

strategies:
  baseline:
    enabled: true
    mode: shadow
    max_signal_age_ms: 2000
    call_model: false

  baseline_jev:
    enabled: true
    mode: paper
    max_signal_age_ms: 12000
    call_model: true

combination:
  baseline_version: baseline_score_v1
  jev_rule_version: jev_veto_only_v1
  openai_rule_version: openai_jev_veto_only_v1
  # Jev não cria trade que a baseline recusou e não inverte direção.
  failure_policy: NO_TRADE
  # 0,50 no Noul é incerteza. 0,55 confirma: acima disso e ainda abaixo do 0,65 que deixava a conta muda.
  # O zero a zero deste payoff fica perto de 0,40. A posição além do teto continua em 0,80.
  min_trend_continuation: 0.55
  extra_entry_min_continuation: 0.80
  max_reversal: 0.65
  # Noul near 0.5 is uncertainty. A false-breakout veto needs a clear yes, and only when a breakout exists.
  max_false_breakout: 0.80
  min_pressure_edge: 0.05
  max_liquidity_sweep: 0.75
  baseline_weight: 0.65
  jev_weight: 0.35
  max_reversal_risk: 0.65
  max_anomaly: 0.80
  min_openai_confidence: 0.45
  block_long_regimes:
    - bearish_expansion
    - bearish_exhaustion
    - breakdown
  block_short_regimes:
    - bullish_expansion
    - breakout
